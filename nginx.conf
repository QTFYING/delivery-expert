# 经销商订单收款平台 - 内层 HTTP Nginx 配置（无 1Panel，全 Docker Compose 场景）
#
# 约定：
# - 本文件仅服务于 docs/deployment/aliyun-full-docker-compose.md
# - 本 Nginx 是应用内层入口，不直接终止 HTTPS
# - HTTPS、证书、外网 80/443 由最外层 Nginx / SLB / 网关统一处理
# - 外层入口按域名回源到本容器暴露的 5001 / 5002 / 5003
# - Docker Compose 需挂载：
#   - ./deploy/frontend/admin   -> /usr/share/nginx/admin
#   - ./deploy/frontend/tenant  -> /usr/share/nginx/tenant
#   - ./deploy/frontend/pay-h5  -> /usr/share/nginx/pay-h5

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# OS 运营台：外层 mp.shoudanba.cn 回源到 5001
server {
    listen 5001;
    server_name _;

    root /usr/share/nginx/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 租户工作台：外层 www.shoudanba.cn 回源到 5002
server {
    listen 5002;
    server_name _;

    # 为导入预检、正式导入预留请求体大小
    client_max_body_size 21m;

    root /usr/share/nginx/tenant;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# C 端收款 H5：外层 h5.shoudanba.cn 回源到 5003
server {
    listen 5003;
    server_name _;

    root /usr/share/nginx/pay-h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
