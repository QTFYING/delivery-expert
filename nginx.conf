# 经销商订单收款平台 - 内层 HTTP Nginx 配置（全 Docker Compose 场景）
#
# 约定：
# - 本 Nginx 是应用内层入口，不直接终止 HTTPS
# - HTTPS、证书、外网 80/443 由最外层 Nginx / SLB / 网关统一处理
# - 外层入口按域名回源到本容器暴露的 5001 / 5002 / 5003
# - Docker Compose 需挂载：
#   - ./deploy/frontend/admin   -> /usr/share/nginx/admin
#   - ./deploy/frontend/tenant  -> /usr/share/nginx/tenant
#   - ./deploy/frontend/pay-h5  -> /usr/share/nginx/pay-h5
#   - ./proxy-common.conf       -> /etc/nginx/proxy-common.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 5001;
    listen 5002;
    listen 5003;
    server_name _;

    client_max_body_size 21m;

    # 按端口切换静态文件根目录
    set $app_root /usr/share/nginx/admin;
    if ($server_port = 5002) { set $app_root /usr/share/nginx/tenant; }
    if ($server_port = 5003) { set $app_root /usr/share/nginx/pay-h5; }

    root $app_root;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 支付公开路由到独立 payment-api
    location /api/pay/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    location /api/payment/webhook/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 其他 API 路由到主 api
    location /api/ {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy-common.conf;
    }
}
