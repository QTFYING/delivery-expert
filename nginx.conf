# 经销商订单收款平台 - 内层 HTTP Nginx 配置（无 1Panel，全 Docker Compose 场景）
#
# 约定：
# - 本文件仅服务于 docs/deployment/aliyun-full-docker-compose.md
# - 本 Nginx 是应用内层入口，不直接终止 HTTPS
# - HTTPS、证书、外网 80/443 由最外层 Nginx / SLB / 网关统一处理
# - 外层入口按域名回源到本容器暴露的 5001 / 5002 / 5003
# - Docker Compose 需挂载：
#   - ./deploy/frontend/admin   -> /usr/share/nginx/admin
#   - ./deploy/frontend/tenant  -> /usr/share/nginx/tenant
#   - ./deploy/frontend/pay-h5  -> /usr/share/nginx/pay-h5
#   - ./proxy-common.conf       -> /etc/nginx/proxy-common.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# OS 运营台：外层 mp.shoudanba.cn 回源到 5001
server {
    listen 5001;
    server_name _;

    root /usr/share/nginx/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # H5 支付公开接口由独立 payment-api 承载
    location /api/pay/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 第三方支付回调由独立 payment-api 承载，避免落回主 API
    location /api/payment/webhook/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 其他 API 由主 api:3000 消费
    location /api/ {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy-common.conf;
    }
}

# 租户工作台：外层 www.shoudanba.cn 回源到 5002
server {
    listen 5002;
    server_name _;

    root /usr/share/nginx/tenant;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # H5 支付公开接口由独立 payment-api 承载
    location /api/pay/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 第三方支付回调由独立 payment-api 承载，避免落回主 API
    location /api/payment/webhook/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 订单导入预检承载大 payload，仅此接口放大请求体限制
    location /api/import/preview {
        client_max_body_size 21m;
        proxy_pass http://api:3000;
        include /etc/nginx/proxy-common.conf;
    }

    # 其他 API 由主 api:3000 消费
    location /api/ {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy-common.conf;
    }
}

# C 端收款 H5：外层 h5.shoudanba.cn 回源到 5003
server {
    listen 5003;
    server_name _;

    root /usr/share/nginx/pay-h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # H5 支付公开接口由独立 payment-api 承载
    location /api/pay/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 第三方支付回调由独立 payment-api 承载，避免落回主 API
    location /api/payment/webhook/ {
        proxy_pass http://payment-api:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # 其他 API 由主 api:3000 消费
    location /api/ {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy-common.conf;
    }
}
